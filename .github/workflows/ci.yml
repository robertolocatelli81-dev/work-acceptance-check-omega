name: ci
# Actions pinned by the commit of their release tag, read in the official repositories on 2026-11-24.
on:
  push:            # every branch, so a branch is measured before it reaches main
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash    # the same shell on Linux, macOS and Windows (Git Bash on Windows)
jobs:
  tests:
    # Every Python from the declared floor (3.9) to 3.14, on Linux, macOS and Windows, with each set of dependencies:
    #   full           cryptography (the declared dependency) and the openssl command line (the optional differential of
    #                  tests/test_tsa_pkix.py), the whole suite, 484 tests, none skipped;
    #   no-openssl     cryptography, no openssl on the PATH: the whole suite, 484 tests, none skipped (the differential
    #                  then compares nothing, and the test still runs every case);
    #   no-cryptography the documented exit 74 path, with cryptography really absent (not masked): the tests that do not
    #                  need it, and the command line on vectors 02 (exit 74) and 21 (exit 2, refused before any crypto).
    # 3.9 has no setup-python build for ubuntu-26.04 (actions/runner-images#14748): on Linux it runs on ubuntu-24.04.
    runs-on: ${{ matrix.os == 'ubuntu' && (matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest') || format('{0}-latest', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        deps: [full, no-openssl, no-cryptography]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Third-party inputs, fetched from the dated copies of SOURCES.json and kept only if their sha256 matches
        run: python tools/fetch_sources.py
      - name: Dependency (cryptography, current release)
        if: matrix.deps != 'no-cryptography'
        run: python -m pip install cryptography
      - name: "full: openssl is on the PATH the tests use (shutil.which)"
        if: matrix.deps == 'full'
        run: |
          openssl version
          python -c "import shutil, sys; p = shutil.which('openssl'); print(p); sys.exit(0 if p else 1)"
      - name: "no-openssl: a PATH that holds the interpreter's folder only"
        if: matrix.deps == 'no-openssl'
        run: |
          d=$(python -c "import os, sys; print(os.path.dirname(sys.executable))")
          if command -v cygpath > /dev/null; then d=$(cygpath -u "$d"); fi      # Git Bash on Windows reads POSIX paths
          echo "WAR_PATH=$d" >> "$GITHUB_ENV"
          PATH="$d" python -c "import shutil, sys; p = shutil.which('openssl'); print('openssl:', p); sys.exit(1 if p else 0)"
      - name: "The whole suite (484 tests, none skipped)"
        if: matrix.deps != 'no-cryptography'
        run: |
          set -e
          set +e; out=$(PATH="${WAR_PATH:-$PATH}" python -B -m unittest discover -s tests 2>&1); rc=$?; set -e   # PATH for python only
          [ $rc = 0 ] || { echo "$out" | tail -80; exit 1; }
          echo "$out" | tail -3
          echo "$out" | grep -Eq "^Ran 484 tests in [0-9.]+s" || { echo "::error::discovery did not run 484 tests"; exit 1; }
          [ "$(echo "$out" | tail -1 | tr -d '\r')" = "OK" ] || { echo "::error::the summary line is not a plain OK (a skip?)"; exit 1; }
      - name: "no-cryptography: the module is absent, and the tests that do not need it pass"
        if: matrix.deps == 'no-cryptography'
        run: |
          set -e
          python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('cryptography') else 0)"
          cd tests
          set +e; out=$(python -B -m unittest test_release_0121 test_cli.CLI.test_exit_74_without_cryptography_full_report test_cli.CLI.test_refused_before_crypto_needs_no_crypto test_cli.CLI.test_refusal_report 2>&1); rc=$?; set -e
          [ $rc = 0 ] || { echo "$out" | tail -60; exit 1; }
          echo "$out" | tail -3
          echo "$out" | grep -Eq "^Ran 19 tests in [0-9.]+s" || { echo "::error::expected 19 tests"; exit 1; }
          [ "$(echo "$out" | tail -1 | tr -d '\r')" = "OK" ] || { echo "::error::not a plain OK (a skip?)"; exit 1; }
      - name: "no-cryptography: the command line gives exit 74 on vector 02 and exit 2 on vector 21"
        if: matrix.deps == 'no-cryptography'
        run: |
          set +e
          python -B war_verify.py fonti/upstream_f7d8984/vectors/02-criteria-committed-after-issue.json > out74.json; a=$?
          python -B war_verify.py fonti/tetsurohhori_4f6cf49/21-unknown-schema.json > out2.json; b=$?
          set -e
          echo "exit $a and $b"
          [ "$a" = 74 ] && [ "$b" = 2 ] || { cat out74.json out2.json; exit 1; }
          python -c "import json; r = json.load(open('out74.json', encoding='utf-8'))['report']; assert r['cannot_run'] and r['signature_valid'] is None, r"
  live-sources:
    # Informative: the live URLs of SOURCES.json against the pinned bytes. A drift (exit 3) or a live URL that cannot
    # be downloaded (exit 4) is a warning, as the suite uses the dated copies only; any other exit is the tool failing,
    # and is red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Live URLs against the pinned bytes (informative)
        run: |
          set +e; out=$(python tools/fetch_sources.py --live 2>&1); rc=$?; set -e
          echo "$out"
          { echo '### Live URLs of SOURCES.json'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case $rc in
            0) ;;
            3) echo "$out" | grep '^LIVE DRIFT' | while read -r line; do echo "::warning title=live source drift::$line"; done ;;
            4) echo "::warning title=live source not downloaded::$(echo "$out" | grep '^ERROR' | head -3 | tr '\n' ' ')" ;;
            *) echo "::error::tools/fetch_sources.py --live failed (exit $rc)"; exit 1 ;;
          esac
  cryptography-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Third-party inputs
        run: python tools/fetch_sources.py
      # 0.12.2, measured locally on 2026-11-27 (Python 3.11.2): 40.0.0 484/484; 39.0.2 64 failures + 8 errors
      # = 72 of 484 (the 13 tests of test_secrets_20261127 pass on both).
      - name: "cryptography 40.0.0: 484/484 pass (README)"
        run: |
          set -e
          python -m pip install "cryptography==40.0.0"
          set +e; out=$(python -B -m unittest discover -s tests 2>&1); rc=$?; set -e
          [ $rc = 0 ] || { echo "$out" | tail -60; exit 1; }
          echo "$out" | grep -Eq "^Ran 484 tests in [0-9.]+s" || { echo "::error::did not run 484 tests"; exit 1; }
          [ "$(echo "$out" | tail -1)" = "OK" ] || { echo "::error::the summary line is not a plain OK (a skip?)"; exit 1; }
      - name: "cryptography 39.0.2: 72 of 484 fail by design, 412 pass (README); any other count, or a skip, is red"
        run: |
          set -e
          python -m pip install "cryptography==39.0.2"
          set +e; out=$(python -B -m unittest discover -s tests 2>&1); rc=$?; set -e
          echo "$out" | tail -3
          n=$(echo "$out" | sed -n 's/^Ran \([0-9]*\) test.*/\1/p')
          fl=$(echo "$out" | sed -n 's/^FAILED (.*failures=\([0-9]*\).*/\1/p'); er=$(echo "$out" | sed -n 's/^FAILED (.*errors=\([0-9]*\).*/\1/p')
          bad=$(( ${fl:-0} + ${er:-0} ))   # unittest splits the 72 into failures and errors
          echo "ran $n, exit $rc, failures ${fl:-0} + errors ${er:-0} = $bad"
          case "$(echo "$out" | tail -1)" in *skipped=*) echo "::error::a test was skipped"; exit 1;; esac
          [ "$n" = 484 ] && [ "$rc" = 1 ] && [ "$bad" = 72 ] || { echo "::error::expected 484 run and 72 not passing"; exit 1; }
  mutants:
    # the targeted mutants of the README: about 14 minutes, so a job of its own (Linux: the scripts link the
    # unmutated files into each copy with os.symlink)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Dependency and third-party inputs
        run: |
          python -m pip install cryptography
          python tools/fetch_sources.py
      - name: "68 targeted mutants, each caught by at least one test (README; the script exits non-zero on a survivor or an unapplied pattern)"
        run: |
          set -e
          out=$(python -B tools/mutate14.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 68/68" || { echo "::error::expected the line 'killed 68/68'"; exit 1; }
      - name: "40 targeted mutants of the 0.6.0 (profile 1.4.2) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate142.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 40/40" || { echo "::error::expected the line 'killed 40/40'"; exit 1; }
      - name: "32 targeted mutants of the 0.7.0 (profile 1.4.3) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate143.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 32/32" || { echo "::error::expected the line 'killed 32/32'"; exit 1; }
      - name: "54 targeted mutants of the 0.8.0 (profile 1.4.4) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate144.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 54/54" || { echo "::error::expected the line 'killed 54/54'"; exit 1; }
      - name: "87 targeted mutants of the 0.9.0 (profile 1.4.5) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate145.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 87/87" || { echo "::error::expected the line 'killed 87/87'"; exit 1; }
      - name: "40 targeted mutants of the 0.10.0 (profile 1.4.7) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate147.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 40/40" || { echo "::error::expected the line 'killed 40/40'"; exit 1; }
      - name: "81 targeted mutants of the 0.11.0 (profile 1.4.8) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate148.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 81/81" || { echo "::error::expected the line 'killed 81/81'"; exit 1; }
      - name: "44 targeted mutants of the 0.12.0 (profile 1.4.11) lines, after a control run of the unmutated copy (README)"
        run: |
          set -e
          out=$(python -B tools/mutate1411.py "$(python -c 'import sys; print(sys.executable)')" 2>&1) || { echo "$out" | tail -40; exit 1; }
          echo "$out" | tail -5
          echo "$out" | grep -qx "killed 44/44" || { echo "::error::expected the line 'killed 44/44'"; exit 1; }
